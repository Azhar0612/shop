<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_chicken_gizzard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
  </defs>

  <!-- Card Outer Background -->
  <rect width="500" height="350" rx="20" fill="url(#bgGrad_chicken_gizzard)" />

  <!-- Inner Decorative Circle Badge -->
  <circle cx="250" cy="140" r="100" fill="#FFFFFF" opacity="0.85" stroke="#C2410C" stroke-width="3" />

  <!-- Graphic Illustration -->
  
        <g transform="translate(175, 80)">
          <ellipse cx="50" cy="60" rx="45" ry="35" fill="#EA580C" />
          <ellipse cx="110" cy="70" rx="40" ry="30" fill="#C2410C" />
          <circle cx="50" cy="60" r="15" fill="#FFFFFF" opacity="0.3" />
          <circle cx="110" cy="70" r="12" fill="#FFFFFF" opacity="0.3" />
        </g>
        

  <!-- Supplier Fresh Badge Tag -->
  <g transform="translate(160, 20)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#C2410C" />
    <text x="90" y="17" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SNEHA FRESH CHICKEN</text>
  </g>

  <!-- Text Title & Subtitle Banner -->
  <g transform="translate(30, 260)">
    <rect width="440" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="220" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#0F172A" text-anchor="middle">Chicken Gizzard</text>
    <text x="220" y="50" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#64748B" text-anchor="middle">Fresh Cleaned Gizzard for Curries</text>
  </g>
</svg>