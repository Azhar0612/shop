<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_chicken_legs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <!-- Card Outer Background -->
  <rect width="500" height="350" rx="20" fill="url(#bgGrad_chicken_legs)" />

  <!-- Inner Decorative Circle Badge -->
  <circle cx="250" cy="140" r="100" fill="#FFFFFF" opacity="0.85" stroke="#B45309" stroke-width="3" />

  <!-- Graphic Illustration -->
  
        <g transform="translate(180, 70)">
          <!-- Drumstick 1 -->
          <path d="M 40 110 C 20 80, 20 40, 50 20 C 80 10, 100 40, 80 80 L 30 130 Z" fill="#D97706" />
          <circle cx="20" cy="140" r="14" fill="#FDE68A" stroke="#B45309" stroke-width="3" />
          <circle cx="35" cy="150" r="14" fill="#FDE68A" stroke="#B45309" stroke-width="3" />
          <!-- Drumstick 2 -->
          <path d="M 100 120 C 80 90, 80 50, 110 30 C 140 20, 160 50, 140 90 L 90 140 Z" fill="#B45309" opacity="0.9" />
          <circle cx="80" cy="150" r="14" fill="#FFFBEB" stroke="#B45309" stroke-width="3" />
          <circle cx="95" cy="160" r="14" fill="#FFFBEB" stroke="#B45309" stroke-width="3" />
        </g>
        

  <!-- Supplier Fresh Badge Tag -->
  <g transform="translate(160, 20)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#B45309" />
    <text x="90" y="17" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SNEHA FRESH CHICKEN</text>
  </g>

  <!-- Text Title & Subtitle Banner -->
  <g transform="translate(30, 260)">
    <rect width="440" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="220" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#0F172A" text-anchor="middle">Chicken Legs</text>
    <text x="220" y="50" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#64748B" text-anchor="middle">Juicy Drumsticks & Leg Cuts</text>
  </g>
</svg>