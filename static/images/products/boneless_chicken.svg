<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_boneless_chicken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
  </defs>

  <!-- Card Outer Background -->
  <rect width="500" height="350" rx="20" fill="url(#bgGrad_boneless_chicken)" />

  <!-- Inner Decorative Circle Badge -->
  <circle cx="250" cy="140" r="100" fill="#FFFFFF" opacity="0.85" stroke="#B91C1C" stroke-width="3" />

  <!-- Graphic Illustration -->
  
        <g transform="translate(160, 75)">
          <rect x="20" y="20" width="55" height="55" rx="12" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
          <rect x="85" y="15" width="60" height="60" rx="14" fill="#B91C1C" stroke="#FFFFFF" stroke-width="3"/>
          <rect x="35" y="85" width="65" height="65" rx="14" fill="#B91C1C" opacity="0.85" stroke="#FFFFFF" stroke-width="3"/>
          <rect x="110" y="80" width="50" height="50" rx="12" fill="#DC2626" opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
        </g>
        

  <!-- Supplier Fresh Badge Tag -->
  <g transform="translate(160, 20)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#B91C1C" />
    <text x="90" y="17" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SNEHA FRESH CHICKEN</text>
  </g>

  <!-- Text Title & Subtitle Banner -->
  <g transform="translate(30, 260)">
    <rect width="440" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="220" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#0F172A" text-anchor="middle">Boneless Chicken</text>
    <text x="220" y="50" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#64748B" text-anchor="middle">100% Pure Boneless Meat Cubes</text>
  </g>
</svg>