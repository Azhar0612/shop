<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="5" width="390" height="110" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
  
  <!-- Crest Icon -->
  <g transform="translate(20, 20)">
    <circle cx="40" cy="40" r="36" fill="url(#yellowGrad)" />
    <!-- Rooster Silhouette / Outline -->
    <path d="M 40 18 C 45 22, 48 26, 46 32 C 52 30, 56 32, 54 38 C 58 40, 56 46, 50 48 C 52 54, 46 62, 38 62 C 30 62, 24 54, 26 48 C 20 46, 18 40, 22 38 C 20 32, 24 30, 30 32 C 28 26, 31 22, 40 18 Z" fill="#FFFFFF" />
    <path d="M 44 24 C 42 20, 38 22, 38 24 Z" fill="url(#redGrad)" />
  </g>
  
  <!-- Text Brand -->
  <text x="110" y="48" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#0F172A" letter-spacing="0.5">JAHANGEER</text>
  <text x="110" y="72" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#D97706" letter-spacing="1">CHICKEN CENTER</text>
  
  <!-- Supplier Subtag -->
  <g transform="translate(110, 80)">
    <rect x="0" y="0" width="220" height="22" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="8" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#B45309">FRESH CHICKEN • SUPPLIED BY SNEHA</text>
  </g>
</svg>
