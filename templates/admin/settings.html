{% extends "admin/base_admin.html" %}

{% block title %}Website Settings | Jahangeer Chicken Center Admin{% endblock %}
{% block header_title %}Website & Store Settings{% endblock %}

{% block content %}
<div class="max-w-4xl space-y-8">
  
  <form method="POST" action="{{ url_for('admin_settings') }}" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
    <h3 class="font-heading font-extrabold text-lg text-slate-900 border-b border-slate-200 pb-3">Store Contact & Location Information</h3>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Shop Name</label>
        <input type="text" name="shop_name" value="{{ settings.shop_name }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3 font-bold">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Opening Hours</label>
        <input type="text" name="opening_hours" value="{{ settings.opening_hours }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3 font-semibold">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Primary Phone Number</label>
        <input type="text" name="phone_primary" value="{{ settings.phone_primary }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3 font-bold text-amber-600">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Alternate Phone Number</label>
        <input type="text" name="phone_secondary" value="{{ settings.phone_secondary }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3 font-bold">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp Business Number</label>
        <input type="text" name="whatsapp_number" value="{{ settings.whatsapp_number }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3 font-bold text-emerald-600">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Instagram Link</label>
        <input type="url" name="instagram_url" value="{{ settings.instagram_url }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Shop Physical Address</label>
      <textarea name="address_line" rows="2" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3">{{ settings.address_line }}</textarea>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Google Maps URL</label>
      <input type="url" name="maps_url" value="{{ settings.maps_url }}" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3">
    </div>

    <div class="border-t border-slate-200 pt-6 space-y-4">
      <h4 class="font-heading font-extrabold text-base text-slate-900">Change Admin Password</h4>
      <div class="max-w-md">
        <label class="block text-xs font-bold text-slate-700 mb-1">New Password (leave blank to keep current)</label>
        <input type="password" name="new_password" placeholder="Enter new password" class="w-full text-sm rounded-xl border-slate-300 bg-slate-50 p-3">
      </div>
    </div>

    <div class="pt-4 flex justify-end">
      <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold px-8 py-3.5 rounded-xl text-sm transition-all shadow-md">
        Save All Settings
      </button>
    </div>

  </form>

</div>
{% endblock %}
