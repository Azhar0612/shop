<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Jahangeer Chicken Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="h-12 w-auto mx-auto mb-2">
      <h1 class="font-heading font-extrabold text-2xl text-slate-900">Admin Login</h1>
      <p class="text-xs text-slate-500">Jahangeer Chicken Center Management Panel</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="space-y-2">
          {% for category, message in messages %}
            <div class="p-3 text-xs font-bold rounded-xl text-center {% if category == 'danger' %} bg-red-50 text-red-700 border border-red-200 {% else %} bg-blue-50 text-blue-700 border border-blue-200 {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
        <input type="text" name="username" required placeholder="Default: admin" class="w-full text-sm rounded-xl border-slate-300 focus:border-amber-500 bg-slate-50 p-3">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full text-sm rounded-xl border-slate-300 focus:border-amber-500 bg-slate-50 p-3">
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-3.5 rounded-xl text-sm transition-all shadow-md">
        Log In to Dashboard →
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="{{ url_for('index') }}" class="text-xs text-slate-500 hover:text-slate-700 font-semibold">← Back to Public Website</a>
    </div>
  </div>

</body>
</html>
